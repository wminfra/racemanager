<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racing Manager | Admin</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="shell"><header class="top"><div class="brand"><b>RM</b> / ADMIN</div><button class="btn secondary" onclick="logout()">Sair</button></header><section id="login"><div class="eyebrow">CONFIGURAÇÃO DO SISTEMA</div><h1 class="title">Acesso administrativo</h1><form class="form" onsubmit="login(event,'/admin')"><input class="input" name="username" autocomplete="username" placeholder="Usuário" required><input class="input" name="password" type="password" autocomplete="current-password" placeholder="Senha" required><button class="btn">Entrar</button><div id="notice" class="notice"></div></form></section><section id="dashboard" class="hidden"><div class="eyebrow">CONTROLE OPERACIONAL</div><h1 class="title">Visão geral</h1><div class="grid"><article class="card"><div class="eyebrow">SESSÕES REGISTRADAS</div><div id="count" class="metric">—</div></article><article class="card"><div class="eyebrow">EM ANDAMENTO</div><div id="running" class="metric">—</div></article><article class="card"><div class="eyebrow">FALHAS TÉCNICAS</div><div id="failures" class="metric">—</div></article></div><div class="grid admin-grid"><article class="card"><h2>Durações disponíveis</h2><p class="muted">Essas opções aparecem para o operador. Não incluem valores ou cobrança.</p><form id="durations" class="form"><input class="input" name="durations" placeholder="15, 30, 60" aria-label="Durações em minutos separadas por vírgula" required><button class="btn">Salvar durações</button><div id="duration-notice" class="notice"></div></form></article><article class="card"><h2>Criar operador</h2><form id="create-user" class="form"><input class="input" name="username" placeholder="Usuário" minlength="3" required><input class="input" name="password" type="password" placeholder="Senha (mínimo 12 caracteres)" minlength="12" required><button class="btn">Adicionar operador</button><div id="admin-notice" class="notice"></div></form></article></div><article class="card"><h2>Estado das sessões</h2><div id="statuses" class="status-list"></div></article></section></main><script src="/assets/app.js"></script><script>
const names={waiting:'Aguardando jogo',running:'Em andamento',completed:'Concluídas',cancelled:'Canceladas',interrupted:'Interrompidas',technical_failure:'Falhas técnicas'};
async function init(){try{const u=await api('/auth/me');if(u.role!=='admin')throw Error('Acesso restrito a administradores');document.querySelector('#login').classList.add('hidden');document.querySelector('#dashboard').classList.remove('hidden');const s=await api('/admin/summary');document.querySelector('#count').textContent=s.sessions_total;document.querySelector('#running').textContent=s.by_status.running+s.by_status.waiting;document.querySelector('#failures').textContent=s.by_status.technical_failure;const list=document.querySelector('#statuses');for(const [key,label] of Object.entries(names)){const row=document.createElement('div');row.className='status-row';const title=document.createElement('span');title.textContent=label;const value=document.createElement('b');value.textContent=s.by_status[key];row.append(title,value);list.append(row)}const d=await api('/admin/session-durations');document.querySelector('[name="durations"]').value=d.durations.join(', ')}catch(e){if(e.message==='Acesso restrito a administradores'){document.querySelector('#notice').textContent=e.message}document.querySelector('#login').classList.remove('hidden')}}
document.querySelector('#create-user').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/admin/users',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password'),role:'operator'})});document.querySelector('#admin-notice').textContent='Operador criado.';e.target.reset()}catch(err){document.querySelector('#admin-notice').textContent=err.message}});
document.querySelector('#durations').addEventListener('submit',async e=>{e.preventDefault();try{const values=document.querySelector('[name="durations"]').value.split(',').map(v=>Number(v.trim()));const d=await api('/admin/session-durations',{method:'PUT',body:JSON.stringify({durations:values})});document.querySelector('[name="durations"]').value=d.durations.join(', ');document.querySelector('#duration-notice').textContent='Durações atualizadas.'}catch(err){document.querySelector('#duration-notice').textContent=err.message}});
init();
</script></body></html>
