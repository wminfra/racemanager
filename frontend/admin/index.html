<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racing Manager | Admin</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="shell"><header class="top"><div class="brand"><b>RM</b> / ADMIN</div><button class="btn secondary" onclick="logout()">Sair</button></header><section id="login"><h1 class="title">Acesso administrativo</h1><form class="form" onsubmit="login(event,'/admin')"><input class="input" name="username" placeholder="Usuário" required><input class="input" name="password" type="password" placeholder="Senha" required><button class="btn">Entrar</button><div id="notice" class="notice"></div></form></section><section id="dashboard" class="hidden"><h1 class="title">Visão geral</h1><p class="muted">Resumo das sessões registradas.</p><div class="grid"><article class="card"><div class="eyebrow">SESSÕES</div><div id="count" class="metric">—</div></article><article class="card"><div class="eyebrow">CONCLUÍDAS</div><div id="completed" class="metric">—</div></article><article class="card"><div class="eyebrow">FATURAMENTO BRUTO</div><div id="revenue" class="metric">—</div></article></div><article class="card"><h2>Criar operador</h2><form id="create-user" class="form"><input class="input" name="username" placeholder="Usuário" minlength="3" required><input class="input" name="password" type="password" placeholder="Senha (mínimo 12 caracteres)" minlength="12" required><button class="btn">Adicionar operador</button><div id="admin-notice" class="notice"></div></form></article></section></main><script src="/assets/app.js"></script><script>(async()=>{try{const u=await api('/auth/me');if(u.role!=='admin')throw Error('Acesso restrito a administradores');document.querySelector('#login').classList.add('hidden');document.querySelector('#dashboard').classList.remove('hidden');const s=await api('/admin/summary');count.textContent=s.sessions_total;completed.textContent=s.sessions_completed;revenue.textContent=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(s.gross_revenue)}catch(e){if(e.message!=='Autenticação necessária'&&e.message!=='Acesso restrito a administradores'){document.querySelector('#login').classList.remove('hidden')}}})();document.querySelector('#create-user').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/admin/users',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password'),role:'operator'})});document.querySelector('#admin-notice').textContent='Operador criado.';e.target.reset()}catch(err){document.querySelector('#admin-notice').textContent=err.message}})</script></body></html>
