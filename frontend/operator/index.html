<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d12"><title>Racing Manager | Operador</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="shell"><header class="top"><div class="brand"><b>RM</b> / OPERATOR</div><button class="btn secondary" onclick="logout()">Sair</button></header><section id="login"><div class="eyebrow">CONTROLE LOCAL DE PISTA</div><h1 class="title">Área do operador</h1><form class="form" onsubmit="login(event,'/operator')"><input class="input" name="username" autocomplete="username" placeholder="Usuário" required><input class="input" name="password" type="password" autocomplete="current-password" placeholder="Senha" required><button class="btn">Entrar</button><div id="notice" class="notice"></div></form></section><section id="panel" class="hidden"><div class="eyebrow">CONTROLE DE PISTA</div><h1 class="title">Sessão do simulador</h1><div class="grid"><article class="card"><div class="eyebrow">SIMULADOR</div><h2 id="sim-name">—</h2><span id="sim-state" class="status off">VERIFICANDO</span><p id="steam-reason" class="muted"></p></article><article class="card"><div class="eyebrow">UTILIZAÇÕES HOJE</div><div id="today" class="metric">—</div><div class="eyebrow">INCLUINDO SESSÕES FALHAS</div></article><article class="card"><div class="eyebrow">TEMPO RESTANTE</div><div id="timer" class="timer">--:--</div><div id="warning" class="notice"></div></article></div><article class="card"><div class="row spread"><h2>Controle da sessão</h2><span id="availability" class="eyebrow">—</span></div><div id="active" class="hidden"><div class="eyebrow">IDENTIFICADOR</div><div id="session-id" class="session-id"></div><div id="launch-state" class="muted"></div></div><form id="start" class="form"><label for="duration" class="eyebrow">DURAÇÃO</label><select id="duration" class="input" required></select><button id="start-btn" class="btn">Iniciar Assetto Corsa Competizione</button><button id="cancel-btn" type="button" class="btn secondary hidden">Cancelar inicialização</button><button id="end-btn" type="button" class="btn secondary hidden">Encerrar sessão agora</button><div id="op-notice" class="notice"></div></form><div id="failure" class="failure hidden"></div></article><article class="card"><h2>Histórico recente</h2><div class="table-wrap"><table><thead><tr><th>Início</th><th>Duração</th><th>Status</th><th>Detalhe</th></tr></thead><tbody id="history"></tbody></table></div></article></section></main><script src="/assets/app.js"></script><script>
let active=null,ws=null;
const statusNames={waiting:'AGUARDANDO JOGO',running:'EM ANDAMENTO',completed:'CONCLUÍDA',cancelled:'CANCELADA',interrupted:'INTERROMPIDA',technical_failure:'FALHA TÉCNICA'};
function updateSession(s){active=s;const pending=!!s&&s.status==='waiting',running=!!s&&s.status==='running';document.querySelector('#active').classList.toggle('hidden',!s);document.querySelector('#session-id').textContent=s?.id||'';document.querySelector('#launch-state').textContent=pending?'Aguardando a inicialização do jogo pela Steam.':'';document.querySelector('#timer').textContent=running?fmt(s.remaining_seconds):pending?'INICIANDO':'--:--';document.querySelector('#timer').style.color=running&&s.remaining_seconds<=30?'var(--red)':'var(--text)';document.querySelector('#warning').textContent=running&&s.warning==='30_seconds'?'Faltam 30 segundos.':running&&s.warning==='2_minutes'?'Faltam 2 minutos.':'';document.querySelector('#start-btn').classList.toggle('hidden',!!s);document.querySelector('#cancel-btn').classList.toggle('hidden',!pending);document.querySelector('#end-btn').classList.toggle('hidden',!running)}
function renderHistory(rows){const body=document.querySelector('#history');body.replaceChildren();for(const item of rows){const tr=document.createElement('tr');const values=[item.started_at?new Date(item.started_at).toLocaleString('pt-BR'):'—',`${item.contracted_minutes} min`,statusNames[item.status]||item.status,item.failure_reason||'—'];for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr)}}
async function refresh(){try{const s=await api('/operator/status');document.querySelector('#login').classList.add('hidden');document.querySelector('#panel').classList.remove('hidden');document.querySelector('#sim-name').textContent=s.simulator;document.querySelector('#today').textContent=s.today_count;document.querySelector('#sim-state').textContent=s.simulator_status.replaceAll('_',' ').toUpperCase();document.querySelector('#sim-state').classList.toggle('off',!s.steam.ready||s.game_process_detected&&!s.session);document.querySelector('#steam-reason').textContent=s.game_process_detected&&!s.session?'Assetto Corsa Competizione foi aberto fora de uma sessão gerenciada. Feche o jogo e tente novamente.':s.steam.reason;document.querySelector('#availability').textContent=s.available?'EQUIPAMENTO DISPONÍVEL':'EQUIPAMENTO INDISPONÍVEL';document.querySelector('#start-btn').disabled=!s.available;updateSession(s.session);const failure=document.querySelector('#failure');failure.textContent=s.recent_failure?.failure_reason||'';failure.classList.toggle('hidden',!s.recent_failure);renderHistory(await api('/operator/sessions?limit=25'))}catch(e){if(e.message.includes('Autenticação'))document.querySelector('#login').classList.remove('hidden');else document.querySelector('#op-notice').textContent=e.message}}
async function loadDurations(){const data=await api('/sessions/durations');document.querySelector('#duration').replaceChildren(...data.durations.map(m=>{const option=document.createElement('option');option.value=m;option.textContent=`${m} minutos`;return option}))}
function connect(){if(ws&&ws.readyState<2)return;ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/ws/session`);ws.onmessage=e=>updateSession(JSON.parse(e.data).running_session);ws.onclose=()=>setTimeout(connect,2500)}
document.querySelector('#start').addEventListener('submit',async e=>{e.preventDefault();document.querySelector('#op-notice').textContent='';try{const m=Number(document.querySelector('#duration').value);const s=await api('/sessions',{method:'POST',body:JSON.stringify({duration_minutes:m,simulator_id:1,game_id:1})});updateSession(s);await refresh()}catch(err){document.querySelector('#op-notice').textContent=err.message;await refresh()}});
document.querySelector('#cancel-btn').onclick=async()=>{if(!active)return;try{await api(`/sessions/${active.id}/cancel`,{method:'POST'});updateSession(null);await refresh()}catch(e){document.querySelector('#op-notice').textContent=e.message}};
document.querySelector('#end-btn').onclick=async()=>{if(!active)return;try{await api(`/sessions/${active.id}/end`,{method:'POST'});updateSession(null);await refresh()}catch(e){document.querySelector('#op-notice').textContent=e.message}};
async function init(){let user;try{user=await api('/auth/me')}catch(e){if(e.status===401)return;document.querySelector('#notice').textContent='Não foi possível validar a sessão: '+e.message;return}if(user.role!=='operator'&&user.role!=='admin'){document.querySelector('#login').classList.remove('hidden');document.querySelector('#notice').textContent='Esta conta não tem permissão para usar o painel do operador.';return}document.querySelector('#login').classList.add('hidden');document.querySelector('#panel').classList.remove('hidden');try{await loadDurations();await refresh();connect()}catch(e){document.querySelector('#op-notice').textContent='Login efetuado, mas não foi possível carregar o painel: '+e.message}}
setInterval(refresh,15000);init();
</script></body></html>
