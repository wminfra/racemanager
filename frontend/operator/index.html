<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racing Manager | Operador</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="shell"><header class="top"><div class="brand"><b>RM</b> / OPERATOR</div><button class="btn secondary" onclick="logout()">Sair</button></header><section id="login"><h1 class="title">Área do operador</h1><form class="form" onsubmit="login(event,'/operator')"><input class="input" name="username" placeholder="Usuário" required><input class="input" name="password" type="password" placeholder="Senha" required><button class="btn">Entrar</button><div id="notice" class="notice"></div></form></section><section id="panel" class="hidden"><h1 class="title">Controle de pista</h1><div class="grid"><article class="card"><div class="eyebrow">SIMULADOR</div><h2 id="sim-name">Simulador</h2><span id="sim-status" class="status off">● NÃO CONECTADO</span></article><article class="card"><div class="eyebrow">SESSÕES HOJE</div><div id="today" class="metric">—</div></article><article class="card"><div class="eyebrow">SESSÃO ATUAL</div><div id="timer" class="timer">--:--</div></article></div><article class="card"><h2>Iniciar sessão</h2><p class="muted">O tempo é controlado pelo servidor. Confirme o pagamento antes de iniciar.</p><form id="start" class="form"><select id="price" class="input" required></select><button id="start-btn" class="btn">Iniciar sessão</button><button id="finish-btn" type="button" class="btn secondary hidden">Encerrar sessão</button><div id="op-notice" class="notice"></div></form></article></section></main><script src="/assets/app.js"></script><script>
let active=null;
const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
async function refresh(){try{const s=await api('/operator/status');document.querySelector('#panel').classList.remove('hidden');document.querySelector('#login').classList.add('hidden');document.querySelector('#sim-name').textContent=s.simulator;document.querySelector('#today').textContent=s.today_count;document.querySelector('#sim-status').textContent=s.simulator_status==='ready'?'● PRONTO':'● NÃO CONECTADO';document.querySelector('#sim-status').classList.toggle('off',s.simulator_status!=='ready');active=s.running_session;document.querySelector('#start-btn').classList.toggle('hidden',!!active);document.querySelector('#finish-btn').classList.toggle('hidden',!active);document.querySelector('#timer').textContent=active?fmt(active.remaining_seconds):'--:--';document.querySelector('#timer').style.color=active&&active.remaining_seconds===0?'var(--red)':'var(--text)'}catch(e){}}
async function init(){try{await api('/auth/me');await refresh();const ps=await api('/pricing');document.querySelector('#price').innerHTML=ps.map(p=>`<option value="${p.id}">${p.name} · ${new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(p.price)}</option>`).join('');if(!ps.length)document.querySelector('#start-btn').disabled=true}catch(e){}}
function connectUpdates(){const scheme=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${scheme}://${location.host}/api/ws/session`);ws.onmessage=e=>{const data=JSON.parse(e.data);active=data.running_session;document.querySelector('#start-btn').classList.toggle('hidden',!!active);document.querySelector('#finish-btn').classList.toggle('hidden',!active);document.querySelector('#timer').textContent=active?fmt(active.remaining_seconds):'--:--';document.querySelector('#timer').style.color=active&&active.remaining_seconds===0?'var(--red)':'var(--text)'};ws.onclose=()=>setTimeout(connectUpdates,3000)}
document.querySelector('#start').addEventListener('submit',async e=>{e.preventDefault();try{await api('/sessions',{method:'POST',body:JSON.stringify({price_option_id:Number(document.querySelector('#price').value),simulator_id:1})});await refresh()}catch(err){document.querySelector('#op-notice').textContent=err.message}});
document.querySelector('#finish-btn').onclick=async()=>{try{await api(`/sessions/${active.id}/finish`,{method:'POST'});await refresh()}catch(e){document.querySelector('#op-notice').textContent=e.message}};
init().then(connectUpdates);
</script></body></html>
