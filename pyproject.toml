[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-manager"
version = "0.1.0"
description = "Local race simulator session management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "itsdangerous>=2.2,<3.0",
  "psutil>=6.0,<8.0",
  "PySide6>=6.7,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_integration: requires the installed Steam client and Assetto Corsa Competizione"]

